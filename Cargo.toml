[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "1.3.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/lassejlv/pi-rs"

[workspace.dependencies]
pi-ai = { path = "crates/pi-ai" }
pi-agent = { path = "crates/pi-agent" }
pi-tui = { path = "crates/pi-tui" }
pi-mcp = { path = "crates/pi-mcp" }
pi-codemode = { path = "crates/pi-codemode" }
pi-jsrt = { path = "crates/pi-jsrt" }
pi-telemetry = { path = "crates/pi-telemetry" }
pi-coding-agent = { path = "crates/pi-coding-agent" }

tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt", "io"] }
futures = "0.3"
async-trait = "0.1"
async-stream = "0.3"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["preserve_order", "raw_value"] }
anyhow = "1"
thiserror = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "rustls-tls-native-roots", "stream", "json", "gzip", "brotli", "deflate", "http2", "socks"] }
url = "2"
uuid = { version = "1", features = ["v4", "v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
once_cell = "1"
parking_lot = "0.12"
base64 = "0.22"
sha2 = "0.10"
rand = "0.8"
dirs = "6"
tracing = "0.1"
bytes = "1"
unicode-width = "0.2"
unicode-segmentation = "1"
icu_segmenter = "2"
fancy-regex = "0.14"
libc = "0.2"
boa_engine = { version = "0.22", features = ["annex-b"] }
oxc_allocator = "0.155"
oxc_parser = "0.155"
oxc_semantic = "0.155"
oxc_transformer = "0.155"
oxc_codegen = "0.155"
oxc_span = "0.155"
oxc_diagnostics = "0.155"
oxc_ast = "0.155"
oxc_ast_visit = "0.155"
md-5 = "0.10"
sha1 = "0.10"
indexmap = { version = "2", features = ["serde"] }
tokio-tungstenite = { version = "0.26", default-features = false, features = ["connect", "handshake", "rustls-tls-native-roots"] }
ruzstd = "0.8"
hmac = "0.12"
rsa = { version = "0.9", features = ["sha2"] }
crc32fast = "1"
flate2 = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
unicode-normalization = "0.1"
yaml-rust2 = "0.10"
ignore = "0.4"
tempfile = "3"
semver = "1"
globset = "0.4"

# Disk is limited in the build environment: keep debug info small.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.test]
debug = "line-tables-only"
incremental = false
