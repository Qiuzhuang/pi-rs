[package]
name = "pi-jsrt"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Embedded pure-Rust JavaScript runtime (Boa + oxc) used by pi extensions and code mode"

[dependencies]
boa_engine.workspace = true
oxc_allocator.workspace = true
oxc_parser.workspace = true
oxc_semantic.workspace = true
oxc_transformer.workspace = true
oxc_codegen.workspace = true
oxc_span.workspace = true
oxc_diagnostics.workspace = true
tokio.workspace = true
tokio-util.workspace = true
futures.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
thiserror.workspace = true
reqwest.workspace = true
url.workspace = true
uuid.workspace = true
parking_lot.workspace = true
base64.workspace = true
sha2.workspace = true
sha1.workspace = true
md-5.workspace = true
rand.workspace = true
dirs.workspace = true
tracing.workspace = true
bytes.workspace = true
libc.workspace = true
unicode-segmentation.workspace = true
regex.workspace = true
crc32fast.workspace = true
ruzstd.workspace = true
miniz_oxide = "0.8"
brotli = "9"
hmac.workspace = true
rsa = { workspace = true, features = ["hazmat"] }
aes = "0.8"
des = "0.8"
cipher = "0.4"
ghash = "0.5"
chacha20 = "0.9"
poly1305 = "0.8"
universal-hash = "0.5"
p256 = { version = "0.13", features = ["ecdsa", "ecdh", "pkcs8", "pem"] }
p384 = { version = "0.13", features = ["ecdsa", "ecdh", "pkcs8", "pem"] }
p521 = { version = "0.13", features = ["ecdsa", "ecdh", "pkcs8", "pem"] }
ed25519-dalek = "2"
x25519-dalek = { version = "2", features = ["static_secrets"] }
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
scrypt = { version = "0.11", default-features = false }
hkdf = "0.12"
pkcs8 = { version = "0.10", features = ["pem", "encryption", "std"] }
spki = { version = "0.7", features = ["pem", "std"] }
sec1 = { version = "0.7", features = ["pem", "std", "der"] }
pkcs1 = { version = "0.7", features = ["pem", "std"] }
der = { version = "0.7", features = ["oid", "std"] }
wasmi = { version = "2", default-features = false, features = ["stable", "std", "validate", "auto-dispatch", "simd"] }
aligned-vec = "0.6"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"
rustls-native-certs = "0.8"
tokio-tungstenite.workspace = true
h2 = "0.4"
http = "1"

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true }
futures.workspace = true
